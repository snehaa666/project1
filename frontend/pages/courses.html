<div class="max-w-7xl mx-auto px-6 py-10">

  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">
      Course Management
    </h1>
    <a href="/home" data-link class="text-sm font-medium text-black-600 hover:text-white-800 hover:underline transition">
      ← Back to Home
    </a>
  </div>

  <div class="flex flex-col lg:flex-row gap-8">

    <div class="w-full lg:w-1/3 lg:sticky lg:top-10 self-start">
      <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
        <h2 class="font-bold text-xl text-gray-700 mb-6">
          Add New Course
        </h2>

        <form id="courseForm" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Course Title</label>
            <input type="text" id="title" placeholder="e.g. Computer Science" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Course Code</label>
            <input type="text" id="code" placeholder="e.g. CS101 (optional)" class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Course Fees</label>
            <input type="number" id="fees" placeholder="e.g. 500" class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
          </div>

          <div class="flex flex-col gap-3 pt-4">
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white
                     font-bold py-3 rounded-lg shadow-sm transition-all active:scale-95">
              Add Course
            </button>

            <button type="button" id="cancelBtn" class="w-full bg-gray-500 hover:bg-gray-600 text-white
                     font-medium py-2 rounded-lg transition hidden">
              Cancel Edit
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="w-full lg:w-2/3">
      <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
        <h2 class="font-bold text-xl text-gray-700 mb-6">
          All Courses
        </h2>

        <div id="loadingSpinner" class="flex flex-col items-center justify-center py-12">
          <div class="animate-spin h-10 w-10 rounded-full border-4 border-blue-500 border-t-transparent"></div>
          <p class="text-gray-400 mt-4 font-medium">Fetching courses...</p>
        </div>

        <div id="coursesTableContainer" class="hidden">
          <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-bold tracking-wider">
                <tr>
                  <th class="px-6 py-4 text-left">ID</th>
                  <th class="px-6 py-4 text-left">Title</th>
                  <th class="px-6 py-4 text-left">Code</th>
                  <th class="px-6 py-4 text-left">Fees</th>
                  <th class="px-6 py-4 text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="coursesTableBody" class="bg-white divide-y divide-gray-200 text-sm text-gray-700">
              </tbody>
            </table>
          </div>

          <div id="noCourses" class="hidden py-12 text-center">
            <p class="text-gray-400 italic">No courses found. Add one using the form on the left.</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="alertContainer" class="fixed bottom-5 right-5 space-y-3 z-50"></div>
</div>
