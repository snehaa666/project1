<div class="max-w-4xl mx-auto px-6 py-10">

  <!-- Header -->
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-semibold text-gray-800 tracking-tight">
      Course Management
    </h1>
    <a
      href="/home"
      data-link
      class="text-sm font-medium text-blue-600 hover:text-blue-700 hover:underline transition"
    >
      ← Back to Home
    </a>
  </div>

  <!-- Add Course Card -->
  <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-10">
    <h2 class="font-semibold text-lg text-gray-700 mb-4">
      Add New Course
    </h2>

    <form id="courseForm" class="space-y-4">
      <input
        type="text"
        id="title"
        placeholder="Course Title"
        required
        class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
               focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
      >

      <input
        type="text"
        id="code"
        placeholder="Course Code (optional)"
        class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm
               focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
      >

      <div class="flex gap-3 pt-2">
        <button
          type="submit"
          id="submitBtn"
          class="flex-1 bg-blue-600 hover:bg-blue-700 text-white
                 font-medium py-2.5 rounded-lg transition"
        >
          Add Course
        </button>

        <button
          type="button"
          id="cancelBtn"
          class="flex-1 bg-gray-500 hover:bg-gray-600 text-white
                 font-medium py-2.5 rounded-lg transition hidden"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>

  <!-- Courses Table Card -->
  <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
    <h2 class="font-semibold text-lg text-gray-700 mb-5">
      All Courses
    </h2>

    <!-- Spinner -->
    <div id="loadingSpinner" class="flex justify-center py-6">
      <div class="animate-spin h-7 w-7 rounded-full border-2 border-blue-500 border-t-transparent"></div>
    </div>

    <!-- Table -->
    <div id="coursesTableContainer" class="hidden overflow-x-auto">
      <table class="min-w-full border border-gray-200 rounded-lg overflow-hidden">
        <thead class="bg-gray-100 text-gray-700 text-sm uppercase tracking-wide">
          <tr>
            <th class="px-4 py-3 font-medium">ID</th>
            <th class="px-4 py-3 font-medium">Title</th>
            <th class="px-4 py-3 font-medium">Code</th>
            <th class="px-4 py-3 font-medium">Actions</th>
          </tr>
        </thead>
        <tbody
          id="coursesTableBody"
          class="divide-y divide-gray-200 text-sm text-gray-700"
        ></tbody>
      </table>

      <p
        id="noCourses"
        class="text-center text-sm text-gray-500 mt-5 hidden"
      >
        No courses found. Add one using the form above.
      </p>
    </div>
  </div>

  <!-- Alerts -->
  <div
    id="alertContainer"
    class="fixed top-5 right-5 space-y-3 z-50"
  ></div>
</div>
