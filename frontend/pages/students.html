<div class="max-w-7xl mx-auto p-6">

  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-bold text-gray-800">Student Management System</h1>
    <a href="/home" data-link class="text-sm font-medium text-black-600 hover:text-white-800 hover:underline transition">← Back to Home</a>
  </div>

  <div class="flex flex-col lg:flex-row gap-8">
    
    <div class="w-full lg:w-1/3 lg:sticky lg:top-6 self-start">
      <div class="bg-white bg-opacity-80 p-6 rounded-xl shadow-lg border border-gray-100">
        <h2 class="font-bold text-xl text-gray-700 mb-5">Add New Student</h2>
        <form id="studentForm" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Full Name</label>
            <input type="text" id="name" placeholder="Name" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Email</label>
            <input type="email" id="email" placeholder="Email" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Course</label>
            <input type="text" id="course" placeholder="Course" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Year</label>
              <input type="text" id="year" placeholder="Year" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Mark</label>
              <input type="text" id="mark" placeholder="Mark" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
            </div>
          </div>
            
          <div class="flex flex-col gap-3 pt-4">
            <button type="submit" id="submitBtn"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition-all active:scale-95">
              Add Student
            </button>

            <button type="button" id="cancelBtn"
              class="w-full bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 rounded-lg hidden transition-all">
              Cancel Edit
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="w-full lg:w-2/3">
      <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
        <h2 class="font-bold text-xl text-gray-700 mb-6">All Students</h2>

        <div id="loadingSpinner" class="text-center py-10">
          <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto"></div>
          <p class="text-gray-400 mt-2">Loading student records...</p>
        </div>

        <div id="studentsTableContainer" class="hidden">
          <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50 text-xs font-bold text-gray-500 uppercase">
                <tr>
                  <th class="px-4 py-3 text-left">ID</th>
                  <th class="px-4 py-3 text-left">Name</th>
                  <th class="px-4 py-3 text-left">Email</th>
                  <th class="px-4 py-3 text-left">Course</th>
                  <th class="px-4 py-3 text-left">Year</th>
                  <th class="px-4 py-3 text-left">Mark</th>
                  <th class="px-4 py-3 text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="studentsTableBody" class="bg-white divide-y divide-gray-100 text-sm">
                </tbody>
            </table>
          </div>

          <p id="noStudents" class="text-center text-gray-400 py-10 italic hidden">
            No students found. Add one using the form on the left.
          </p>
        </div>
      </div>
    </div>

  </div>

  <div id="alertContainer" class="fixed bottom-4 right-4 space-y-2 z-50"></div>
</div>
