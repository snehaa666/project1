<div class="max-w-7xl mx-auto p-6">

    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Teacher Management System</h1>
        <a href="/home" data-link class="text-sm font-medium text-black-600 hover:text-white-800 hover:underline transition">← Back to Home</a>
    </div>

    <div class="flex flex-col lg:flex-row gap-8">
        
        <div class="w-full lg:w-1/3 lg:sticky lg:top-6 self-start">
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
                <h2 class="font-bold mb-4 text-xl text-gray-700">Add New Teacher</h2>
                <form id="TeacherForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Full Name</label>
                        <input type="text" id="name" placeholder="Enter name" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Email Address</label>
                        <input type="email" id="email" placeholder="email@example.com" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Subject</label>
                        <input type="text" id="Subject" placeholder="Mathematics" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                    </div>
                    
                    <div class="flex flex-col space-y-2 pt-2">
                        <button type="submit" id="submitBtn"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-md transition-all active:scale-95">
                            Add Teacher
                        </button>

                        <button type="button" id="cancelBtn"
                            class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2.5 rounded-lg hidden transition-all">
                            Cancel Edit
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="w-full lg:w-2/3">
            <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="font-bold text-xl text-gray-700">All Teachers</h2>
                </div>

                <div id="loadingSpinner" class="text-center py-10">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto"></div>
                    <p class="text-gray-500 mt-2">Loading data...</p>
                </div>

                <div id="TeacherTableContainer" class="hidden">
                    <div class="overflow-x-auto rounded-lg border border-gray-200">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">ID</th>
                                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Name</th>
                                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Email</th>
                                    <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Subject</th>
                                    <th class="px-4 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="TeacherTableBody" class="bg-white divide-y divide-gray-100">
                                </tbody>
                        </table>
                    </div>

                    <p id="noTeachers" class="text-center text-gray-400 py-10 italic hidden">
                        No teachers found. Add one using the form on the left.
                    </p>
                </div>
            </div>
        </div>

    </div>

    <div id="alertContainer" class="fixed bottom-4 right-4 space-y-2 z-50"></div>
</div>
