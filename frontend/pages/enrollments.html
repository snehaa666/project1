<div class="max-w-7xl mx-auto px-6 py-10">

  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">
      Student Enrollments
    </h1>
    <a href="home.html" class="text-sm font-medium text-black-600  transition flex items-center gap-1">
      ← Back to Home
    </a>
  </div>

  <div class="flex flex-col lg:flex-row gap-8">

    <div class="w-full lg:w-1/3 lg:sticky lg:top-10 self-start">
      <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
        <h2 class="font-bold text-xl text-gray-700 mb-6">
          New Enrollment
        </h2>

        <form id="enrollmentForm" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Select Student</label>
            <select id="student_id" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm 
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-white">
              <option value="">Choose a student...</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Select Course</label>
            <select id="course_id" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm 
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-white">
              <option value="">Choose a course...</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-600 mb-1">Assign Teacher</label>
            <select id="teacher_id" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm 
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-white">
              <option value="">Assign faculty...</option>
            </select>
          </div>

          <div class="pt-4">
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white 
                     font-bold py-3 rounded-lg shadow-sm transition-all active:scale-95">
              Enroll Student
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="w-full lg:w-2/3">
      <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
        <h2 class="font-bold text-xl text-gray-700 mb-6">
          All Enrollments
        </h2>

        <div id="loadingSpinner" class="flex flex-col items-center justify-center py-12">
          <div class="animate-spin h-10 w-10 rounded-full border-4 border-blue-500 border-t-transparent"></div>
          <p class="text-gray-400 mt-4 font-medium">Loading records...</p>
        </div>

        <div id="enrollmentsTableContainer" class="hidden">
          <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-bold tracking-wider">
                <tr>
                  <th class="px-6 py-4 text-left">ID</th>
                  <th class="px-6 py-4 text-left">Student ID</th>
                  <th class="px-6 py-4 text-left">Course ID</th>
                  <th class="px-6 py-4 text-left">Teacher ID</th>
                  <th class="px-6 py-4 text-left">Date</th>
                  <th class="px-6 py-4 text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="enrollmentsTableBody" class="bg-white divide-y divide-gray-200 text-sm text-gray-700">
                </tbody>
            </table>
          </div>

          <div id="noEnrollments" class="hidden py-12 text-center">
            <svg class="mx-auto h-12 w-12 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <p class="text-gray-400 italic">No student enrollments found.</p>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="alertContainer" class="fixed bottom-5 right-5 space-y-3 z-50"></div>
</div>
