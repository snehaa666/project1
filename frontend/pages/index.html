<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student MGMT</title>

    <!-- Favicon -->
     <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/476/476863.png" type="image/png" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Project CSS -->
    <link rel="stylesheet" href="/frontend/assets/css/style.css" />

    <!-- Global Styles -->
    <style>
        body {
            font-family: "Epunda Slab", serif;
            letter-spacing: 0.3px;
            background-color: rgb(59, 130, 246);
            background-image: radial-gradient(at 30% 21%, rgb(56, 189, 248) 0, transparent 57%), radial-gradient(at 18% 50%, rgb(146, 64, 14) 0, transparent 22%), radial-gradient(at 61% 80%, transparent 35%), radial-gradient(at 49% 5%, rgb(120, 53, 15) 0, transparent 100%), radial-gradient(at 94% 96%, rgb(165, 180, 252) 0, transparent 44%), radial-gradient(at 55% 70%, rgb(249, 168, 212) 0, transparent 48%);

        }
    </style>
</head>

<body class="min-h-screen flex flex-col bg-blue-100">

    <div id="header"></div>

    <!-- SPA Root Container -->
    <main id="app" class="w-full">
        <!-- Router content loads here -->
    </main>

    <!-- Footer (Loaded Dynamically) -->
    <div id="footer"></div>

    <!-- Environment Variables -->
    <script src="/frontend/env.js"></script>

    <!-- JS Modules -->
    <script type="module">
        import { loadComponent } from "/frontend/assets/js/utils/loadComponent.js";
        import { initRouterEvents, router } from "/frontend/assets/js/router/viewRouter.js";

        // Load header and footer
        loadComponent("#header", "/frontend/assets/js/components/Header.html");
        loadComponent("#footer", "/frontend/assets/js/components/Footer.html");

        // Initialize SPA routing
        initRouterEvents();
        router();
    </script>

</body>

</html>
